<div class="app-shell">
  <header class="app-header">
    <a routerLink="/" class="brand">angular-coderabbit</a>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        Products
      </a>
      <a routerLink="/cart" routerLinkActive="nav-active" class="nav-link nav-cart">
        Cart
        @if (cartCount() > 0) {
          <span class="badge">{{ cartCount() }}</span>
        }
      </a>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
